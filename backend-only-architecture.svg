<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260" role="img" aria-labelledby="title desc">
  <title id="title">Backend Only Architecture</title>
  <desc id="desc">Focused FastAPI CRM backend architecture showing clients, application bootstrap, middleware, domain modules, persistence, background dispatch infrastructure, integrations, and observability without agent internals.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#475569"/></marker>
    <marker id="blue-arrow" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="green-arrow" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto"><path d="M0,0 L11,5 L0,10 z" fill="#15803d"/></marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title { font: 700 34px sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px sans-serif; fill: #475569; }
      .section { font: 700 19px sans-serif; fill: #0f172a; }
      .bt { font: 700 15px sans-serif; fill: #0f172a; }
      .tx { font: 400 12px sans-serif; fill: #334155; }
      .sm { font: 400 12px sans-serif; fill: #475569; }
      .tiny { font: 400 11px sans-serif; fill: #64748b; }
      .layer { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .client { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; }
      .api { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .core { fill: #f3e8ff; stroke: #9333ea; stroke-width: 2; }
      .data { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .external { fill: #f1f5f9; stroke: #64748b; stroke-width: 2; }
      .ops { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
      .line { stroke: #475569; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .blue { stroke: #2563eb; stroke-width: 2.5; fill: none; marker-end: url(#blue-arrow); }
      .green { stroke: #15803d; stroke-width: 2.2; fill: none; marker-end: url(#green-arrow); }
      .dash { stroke-dasharray: 8 6; }
    </style>
  </defs>
  <rect width="1800" height="1260" fill="#ffffff"/>
  <text x="54" y="54" class="title">Backend Only</text>
  <text x="54" y="82" class="subtitle">FastAPI application, CRM domain services, persistence, integrations, and operations</text>
  <rect x="54" y="105" width="1692" height="42" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="74" y="117" width="17" height="17" rx="4" class="client"/><text x="99" y="130" class="sm">Clients</text>
  <rect x="190" y="117" width="17" height="17" rx="4" class="api"/><text x="215" y="130" class="sm">API layer</text>
  <rect x="315" y="117" width="17" height="17" rx="4" class="core"/><text x="340" y="130" class="sm">Backend services</text>
  <rect x="480" y="117" width="17" height="17" rx="4" class="data"/><text x="505" y="130" class="sm">Data and queues</text>
  <rect x="650" y="117" width="17" height="17" rx="4" class="external"/><text x="675" y="130" class="sm">External systems</text>
  <rect x="830" y="117" width="17" height="17" rx="4" class="ops"/><text x="855" y="130" class="sm">Operations</text>
  <text x="1410" y="130" class="tiny">Backend boundary: request -> API -> service -> data or integration</text>

  <rect x="54" y="175" width="1692" height="140" rx="14" class="layer"/>
  <text x="76" y="204" class="section">1. Clients and application boundary</text>
  <rect x="90" y="225" width="300" height="68" rx="10" class="client" filter="url(#shadow)"/>
  <text x="240" y="250" text-anchor="middle" class="bt">Web frontend</text>
  <text x="240" y="272" text-anchor="middle" class="tx">browser requests and user actions</text>
  <rect x="450" y="225" width="300" height="68" rx="10" class="client" filter="url(#shadow)"/>
  <text x="600" y="250" text-anchor="middle" class="bt">Direct API clients</text>
  <text x="600" y="272" text-anchor="middle" class="tx">integrations and internal callers</text>
  <rect x="810" y="225" width="300" height="68" rx="10" class="api" filter="url(#shadow)"/>
  <text x="960" y="250" text-anchor="middle" class="bt">FastAPI application</text>
  <text x="960" y="272" text-anchor="middle" class="tx">app/main.py and router registration</text>
  <rect x="1170" y="225" width="480" height="68" rx="10" class="api" filter="url(#shadow)"/>
  <text x="1410" y="250" text-anchor="middle" class="bt">Cross-cutting request controls</text>
  <text x="1410" y="272" text-anchor="middle" class="tx">CORS, auth, logging, errors, tracing, tRPC context</text>
  <path d="M390 259 H450" class="blue"/><path d="M750 259 H810" class="blue"/><path d="M1110 259 H1170" class="blue"/>

  <rect x="54" y="340" width="1692" height="240" rx="14" class="layer"/>
  <text x="76" y="369" class="section">2. API routers and application services</text>
  <rect x="90" y="400" width="260" height="145" rx="10" class="api" filter="url(#shadow)"/>
  <text x="220" y="428" text-anchor="middle" class="bt">CRM APIs</text>
  <text x="220" y="451" text-anchor="middle" class="tx">companies, contacts, deals</text>
  <text x="220" y="469" text-anchor="middle" class="tx">activities, fields, workspace</text>
  <text x="220" y="487" text-anchor="middle" class="tx">search, dashboard, archive</text>
  <text x="220" y="513" text-anchor="middle" class="tiny">router -> schema -> service</text>
  <rect x="400" y="400" width="260" height="145" rx="10" class="api" filter="url(#shadow)"/>
  <text x="530" y="428" text-anchor="middle" class="bt">Account and access APIs</text>
  <text x="530" y="451" text-anchor="middle" class="tx">auth, users, SSO, API keys</text>
  <text x="530" y="469" text-anchor="middle" class="tx">settings and permissions</text>
  <text x="530" y="487" text-anchor="middle" class="tx">current-user dependencies</text>
  <text x="530" y="513" text-anchor="middle" class="tiny">authentication before service calls</text>
  <rect x="710" y="400" width="260" height="145" rx="10" class="api" filter="url(#shadow)"/>
  <text x="840" y="428" text-anchor="middle" class="bt">Communication APIs</text>
  <text x="840" y="451" text-anchor="middle" class="tx">mailbox, Google, Microsoft</text>
  <text x="840" y="469" text-anchor="middle" class="tx">Slack, conversations</text>
  <text x="840" y="487" text-anchor="middle" class="tx">sync and tracking</text>
  <text x="840" y="513" text-anchor="middle" class="tiny">provider-specific adapters</text>
  <rect x="1020" y="400" width="300" height="145" rx="10" class="core" filter="url(#shadow)"/>
  <text x="1170" y="428" text-anchor="middle" class="bt">Domain services</text>
  <text x="1170" y="451" text-anchor="middle" class="tx">business rules and contracts</text>
  <text x="1170" y="469" text-anchor="middle" class="tx">validation and authorization</text>
  <text x="1170" y="487" text-anchor="middle" class="tx">CRUD and domain workflows</text>
  <text x="1170" y="513" text-anchor="middle" class="tiny">async SQLAlchemy sessions</text>
  <rect x="1370" y="400" width="310" height="145" rx="10" class="core" filter="url(#shadow)"/>
  <text x="1525" y="428" text-anchor="middle" class="bt">Background dispatch</text>
  <text x="1525" y="451" text-anchor="middle" class="tx">AgentTriggerService</text>
  <text x="1525" y="469" text-anchor="middle" class="tx">task enqueue and deduplication</text>
  <text x="1525" y="487" text-anchor="middle" class="tx">worker / bridge integration</text>
  <text x="1525" y="513" text-anchor="middle" class="tiny">async work leaves request path</text>
  <path d="M960 293 V365 H220 V400" class="blue"/><path d="M960 293 V365 H530 V400" class="blue"/><path d="M960 293 V365 H840 V400" class="blue"/><path d="M960 293 V365 H1170 V400" class="blue"/><path d="M960 293 V365 H1525 V400" class="blue"/>

  <rect x="54" y="605" width="1692" height="220" rx="14" class="layer"/>
  <text x="76" y="634" class="section">3. Persistence and background infrastructure</text>
  <rect x="90" y="665" width="330" height="125" rx="10" class="data" filter="url(#shadow)"/>
  <text x="255" y="693" text-anchor="middle" class="bt">PostgreSQL database</text>
  <text x="255" y="716" text-anchor="middle" class="tx">CRM entities and relationships</text>
  <text x="255" y="734" text-anchor="middle" class="tx">users, companies, contacts, deals</text>
  <text x="255" y="752" text-anchor="middle" class="tx">activities, fields, conversations</text>
  <text x="255" y="776" text-anchor="middle" class="tiny">SQLAlchemy Base + migrations</text>
  <rect x="470" y="665" width="330" height="125" rx="10" class="data" filter="url(#shadow)"/>
  <text x="635" y="693" text-anchor="middle" class="bt">Task and event tables</text>
  <text x="635" y="716" text-anchor="middle" class="tx">AgentTask dispatch records</text>
  <text x="635" y="734" text-anchor="middle" class="tx">run/event history and audit data</text>
  <text x="635" y="752" text-anchor="middle" class="tx">retry, priority, budget, due_at</text>
  <text x="635" y="776" text-anchor="middle" class="tiny">durable boundary for async work</text>
  <rect x="850" y="665" width="300" height="125" rx="10" class="core" filter="url(#shadow)"/>
  <text x="1000" y="693" text-anchor="middle" class="bt">Worker process</text>
  <text x="1000" y="716" text-anchor="middle" class="tx">poll, claim, execute, settle</text>
  <text x="1000" y="734" text-anchor="middle" class="tx">bridge for non-agent tasks</text>
  <text x="1000" y="752" text-anchor="middle" class="tx">cancellation and redelivery</text>
  <text x="1000" y="776" text-anchor="middle" class="tiny">separate from HTTP lifecycle</text>
  <rect x="1200" y="665" width="480" height="125" rx="10" class="data" filter="url(#shadow)"/>
  <text x="1440" y="693" text-anchor="middle" class="bt">Cache, files, and generated outputs</text>
  <text x="1440" y="716" text-anchor="middle" class="tx">cache services and workspace files</text>
  <text x="1440" y="734" text-anchor="middle" class="tx">reports, charts, PDFs, attachments</text>
  <text x="1440" y="752" text-anchor="middle" class="tx">runner file delivery endpoint</text>
  <text x="1440" y="776" text-anchor="middle" class="tiny">filesystem and object-like boundaries</text>
  <path d="M1170 545 V605 H255 V665" class="green"/><path d="M1525 545 V605 H635 V665" class="green"/><path d="M1525 545 V605 H1000 V665" class="line"/><path d="M1170 545 V605 H1440 V665" class="green dash"/>

  <rect x="54" y="850" width="1692" height="230" rx="14" class="layer"/>
  <text x="76" y="879" class="section">4. External integrations and operations</text>
  <rect x="90" y="910" width="330" height="125" rx="10" class="external" filter="url(#shadow)"/>
  <text x="255" y="938" text-anchor="middle" class="bt">Identity and providers</text>
  <text x="255" y="961" text-anchor="middle" class="tx">OAuth, SSO, Google, Microsoft</text>
  <text x="255" y="979" text-anchor="middle" class="tx">mailbox and calendar systems</text>
  <text x="255" y="1005" text-anchor="middle" class="tiny">credentials managed by settings</text>
  <rect x="470" y="910" width="330" height="125" rx="10" class="external" filter="url(#shadow)"/>
  <text x="635" y="938" text-anchor="middle" class="bt">Communication systems</text>
  <text x="635" y="961" text-anchor="middle" class="tx">Slack and messaging channels</text>
  <text x="635" y="979" text-anchor="middle" class="tx">email and conversation sync</text>
  <text x="635" y="1005" text-anchor="middle" class="tiny">webhook or scheduled sync paths</text>
  <rect x="850" y="910" width="330" height="125" rx="10" class="ops" filter="url(#shadow)"/>
  <text x="1015" y="938" text-anchor="middle" class="bt">Observability</text>
  <text x="1015" y="961" text-anchor="middle" class="tx">OpenTelemetry traces and spans</text>
  <text x="1015" y="979" text-anchor="middle" class="tx">request and error logging</text>
  <text x="1015" y="1005" text-anchor="middle" class="tiny">health endpoint and telemetry APIs</text>
  <rect x="1230" y="910" width="450" height="125" rx="10" class="ops" filter="url(#shadow)"/>
  <text x="1455" y="938" text-anchor="middle" class="bt">Deployment and operations</text>
  <text x="1455" y="961" text-anchor="middle" class="tx">Dockerfile, settings, environment</text>
  <text x="1455" y="979" text-anchor="middle" class="tx">Alembic migrations and seed scripts</text>
  <text x="1455" y="1005" text-anchor="middle" class="tiny">/health and graceful lifespan shutdown</text>
  <path d="M255 790 V850 H255 V910" class="line dash"/><path d="M255 790 V850 H635 V910" class="line dash"/><path d="M1000 790 V850 H1015 V910" class="line dash"/><path d="M1440 790 V850 H1455 V910" class="line dash"/>

  <rect x="90" y="1110" width="1590" height="72" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="885" y="1138" text-anchor="middle" class="bt">Backend invariant</text>
  <text x="885" y="1161" text-anchor="middle" class="sm">HTTP routers authenticate and validate requests, services apply domain rules, and durable data or integrations own the resulting state.</text>
</svg>
