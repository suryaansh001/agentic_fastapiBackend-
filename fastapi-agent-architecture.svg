<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1780" viewBox="0 0 1400 1780" role="img" aria-labelledby="title desc">
  <title id="title">FastAPI Agentic Backend Architecture</title>
  <desc id="desc">Implemented FastAPI agent request flow, database model layer, and explicitly unimplemented durable worker and subagent components.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 34px sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px sans-serif; fill: #475569; }
      .section { font: 700 22px sans-serif; fill: #0f172a; }
      .box-title { font: 700 17px sans-serif; fill: #0f172a; }
      .box-text { font: 400 14px sans-serif; fill: #334155; }
      .small { font: 400 13px sans-serif; fill: #475569; }
      .missing-text { font: 700 14px sans-serif; fill: #991b1b; }
      .implemented { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .storage { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .external { fill: #f1f5f9; stroke: #64748b; stroke-width: 2; }
      .missing { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; stroke-dasharray: 9 7; }
      .target { fill: #fef3c7; stroke: #d97706; stroke-width: 2; stroke-dasharray: 9 7; }
      .line { stroke: #475569; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .dashed-line { stroke: #dc2626; stroke-width: 2.2; stroke-dasharray: 8 7; fill: none; marker-end: url(#arrow); }
      .target-line { stroke: #d97706; stroke-width: 2.2; stroke-dasharray: 8 7; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="1780" fill="#ffffff"/>
  <text x="70" y="68" class="title">FastAPI Agentic Backend Architecture</text>
  <text x="70" y="100" class="subtitle">Current implementation with planned and missing runtime components made explicit</text>

  <rect x="70" y="130" width="1260" height="48" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="92" y="146" width="18" height="18" rx="4" class="implemented"/>
  <text x="120" y="161" class="small">Implemented</text>
  <rect x="260" y="146" width="18" height="18" rx="4" class="missing"/>
  <text x="288" y="161" class="small">Not implemented or incomplete</text>

  <text x="70" y="225" class="section">1. Implemented unified request flow</text>
  <rect x="70" y="250" width="220" height="82" rx="12" class="implemented" filter="url(#shadow)"/>
  <text x="180" y="282" text-anchor="middle" class="box-title">Frontend / API client</text>
  <text x="180" y="307" text-anchor="middle" class="box-text">User message</text>

  <rect x="350" y="250" width="220" height="82" rx="12" class="implemented" filter="url(#shadow)"/>
  <text x="460" y="282" text-anchor="middle" class="box-title">Unified router</text>
  <text x="460" y="307" text-anchor="middle" class="box-text">POST /api/agents/unified/chat</text>

  <rect x="630" y="250" width="220" height="82" rx="12" class="implemented" filter="url(#shadow)"/>
  <text x="740" y="282" text-anchor="middle" class="box-title">Keyword route()</text>
  <text x="740" y="307" text-anchor="middle" class="box-text">Selects one family</text>

  <rect x="910" y="250" width="220" height="82" rx="12" class="implemented" filter="url(#shadow)"/>
  <text x="1020" y="282" text-anchor="middle" class="box-title">Orchestrator.run()</text>
  <text x="1020" y="307" text-anchor="middle" class="box-text">Max 15 iterations</text>

  <rect x="1190" y="250" width="140" height="82" rx="12" class="storage" filter="url(#shadow)"/>
  <text x="1260" y="282" text-anchor="middle" class="box-title">AgentState</text>
  <text x="1260" y="307" text-anchor="middle" class="box-text">In memory</text>

  <path d="M290 291 H350" class="line"/><path d="M570 291 H630" class="line"/><path d="M850 291 H910" class="line"/><path d="M1130 291 H1190" class="line"/>

  <rect x="210" y="390" width="250" height="96" rx="12" class="implemented" filter="url(#shadow)"/>
  <text x="335" y="423" text-anchor="middle" class="box-title">LLMService</text>
  <text x="335" y="449" text-anchor="middle" class="box-text">Ollama or Groq</text>
  <text x="335" y="470" text-anchor="middle" class="box-text">Tool metadata + response</text>

  <rect x="575" y="390" width="250" height="96" rx="12" class="implemented" filter="url(#shadow)"/>
  <text x="700" y="423" text-anchor="middle" class="box-title">_extract_tool_calls()</text>
  <text x="700" y="449" text-anchor="middle" class="box-text">Manual JSON parsing</text>
  <text x="700" y="470" text-anchor="middle" class="box-text">Not native tool protocol</text>

  <rect x="940" y="390" width="250" height="96" rx="12" class="implemented" filter="url(#shadow)"/>
  <text x="1065" y="423" text-anchor="middle" class="box-title">Guardrails</text>
  <text x="1065" y="449" text-anchor="middle" class="box-text">Auto or approval required</text>
  <text x="1065" y="470" text-anchor="middle" class="box-text">Then execute selected tool</text>

  <path d="M1020 332 V360 H335 V390" class="line"/>
  <path d="M460 438 H575" class="line"/><path d="M825 438 H940" class="line"/>
  <path d="M1065 486 V530 H1020 V332" class="line"/>

  <text x="70" y="585" class="section">2. Fixed agent families and tools</text>
  <rect x="100" y="620" width="350" height="120" rx="12" class="implemented" filter="url(#shadow)"/>
  <text x="275" y="655" text-anchor="middle" class="box-title">Root agent</text>
  <text x="275" y="682" text-anchor="middle" class="box-text">CRM research, enrichment, facts</text>
  <text x="275" y="705" text-anchor="middle" class="box-text">26 direct endpoints</text>

  <rect x="525" y="620" width="350" height="120" rx="12" class="implemented" filter="url(#shadow)"/>
  <text x="700" y="655" text-anchor="middle" class="box-title">Runner agent</text>
  <text x="700" y="682" text-anchor="middle" class="box-text">Queries, Python, charts, reports</text>
  <text x="700" y="705" text-anchor="middle" class="box-text">19 direct endpoints</text>

  <rect x="950" y="620" width="350" height="120" rx="12" class="implemented" filter="url(#shadow)"/>
  <text x="1125" y="655" text-anchor="middle" class="box-title">Builder agent</text>
  <text x="1125" y="682" text-anchor="middle" class="box-text">Files, drafts, agent building</text>
  <text x="1125" y="705" text-anchor="middle" class="box-text">11 direct endpoints</text>

  <path d="M1065 486 V570 H275 V620" class="line"/><path d="M1065 486 V620 H700" class="line"/><path d="M1065 486 V570 H1125 V620" class="line"/>

  <text x="70" y="825" class="section">3. Persistence and external services</text>
  <rect x="90" y="860" width="390" height="180" rx="12" class="storage" filter="url(#shadow)"/>
  <text x="285" y="895" text-anchor="middle" class="box-title">CRM database</text>
  <text x="285" y="924" text-anchor="middle" class="box-text">Contacts, companies, deals</text>
  <text x="285" y="950" text-anchor="middle" class="box-text">AgentDefinition / Version</text>
  <text x="285" y="976" text-anchor="middle" class="box-text">AgentTask / Run / Action</text>
  <text x="285" y="1002" text-anchor="middle" class="box-text">Events and audit models</text>

  <rect x="550" y="860" width="330" height="180" rx="12" class="external" filter="url(#shadow)"/>
  <text x="715" y="895" text-anchor="middle" class="box-title">Files and reports</text>
  <text x="715" y="924" text-anchor="middle" class="box-text">/tmp charts</text>
  <text x="715" y="950" text-anchor="middle" class="box-text">backend/reports PDFs</text>
  <text x="715" y="976" text-anchor="middle" class="box-text">Builder file operations</text>

  <rect x="950" y="860" width="350" height="180" rx="12" class="external" filter="url(#shadow)"/>
  <text x="1125" y="895" text-anchor="middle" class="box-title">External providers</text>
  <text x="1125" y="924" text-anchor="middle" class="box-text">Ollama / Groq</text>
  <text x="1125" y="950" text-anchor="middle" class="box-text">Perplexity / web services</text>
  <text x="1125" y="976" text-anchor="middle" class="box-text">Shell and Python runtime</text>

  <path d="M275 740 V860" class="line"/><path d="M700 740 V860" class="line"/><path d="M1125 740 V860" class="line"/>

  <text x="70" y="1125" class="section">4. Explicitly missing from the FastAPI runtime</text>
  <rect x="90" y="1160" width="390" height="145" rx="12" class="missing" filter="url(#shadow)"/>
  <text x="285" y="1195" text-anchor="middle" class="missing-text">Durable worker</text>
  <text x="285" y="1222" text-anchor="middle" class="box-text">Task claiming, leases, retries</text>
  <text x="285" y="1248" text-anchor="middle" class="box-text">Dispatch methods are stubs</text>
  <text x="285" y="1274" text-anchor="middle" class="box-text">End-to-end execution missing</text>

  <rect x="550" y="1160" width="330" height="145" rx="12" class="missing" filter="url(#shadow)"/>
  <text x="715" y="1195" text-anchor="middle" class="missing-text">Subagent spawning</text>
  <text x="715" y="1222" text-anchor="middle" class="box-text">No spawn or delegation tool</text>
  <text x="715" y="1248" text-anchor="middle" class="box-text">No parent-child run IDs</text>
  <text x="715" y="1274" text-anchor="middle" class="box-text">No recursive agent protocol</text>

  <rect x="950" y="1160" width="350" height="145" rx="12" class="missing" filter="url(#shadow)"/>
  <text x="1125" y="1195" text-anchor="middle" class="missing-text">Durable unified state</text>
  <text x="1125" y="1222" text-anchor="middle" class="box-text">AgentState is process-local</text>
  <text x="1125" y="1248" text-anchor="middle" class="box-text">Restart loses active tasks</text>
  <text x="1125" y="1274" text-anchor="middle" class="box-text">Run/event persistence incomplete</text>

  <path d="M285 1040 V1160" class="dashed-line"/><path d="M715 1040 V1160" class="dashed-line"/><path d="M1125 1040 V1160" class="dashed-line"/>

  <rect x="70" y="1400" width="1260" height="92" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="100" y="1434" class="box-title">Bottom line</text>
  <text x="100" y="1462" class="box-text">Current FastAPI count: 3 fixed agent families. Subagents, durable workers, and parent-child delegation are not implemented here.</text>
</svg>